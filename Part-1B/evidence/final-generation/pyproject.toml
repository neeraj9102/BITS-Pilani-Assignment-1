[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bits-assignment-1b-reminder-agent"
version = "0.1.0"
description = "Non-deterministic natural language reminder proposal agent for BITS Pilani Assignment 1"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.66",
  "jsonschema>=4.18",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
reminder-agent = "reminder_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
